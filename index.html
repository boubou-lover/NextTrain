<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NextTrain — Horaires SNCB</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NextTrain">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  
  <link rel="stylesheet" href="styles.css" />

  <script>
    // Thème clair / sombre : choix manuel mémorisé (bouton 🌙/☀️), sinon réglage du système.
    // Appliqué avant l'affichage de la page pour éviter tout flash blanc.
    (function () {
      var KEY = "nt_theme";
      var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      function stored() {
        try { var v = localStorage.getItem(KEY); return v === "dark" || v === "light" ? v : null; } catch (e) { return null; }
      }
      function current() { return stored() || (mq && mq.matches ? "dark" : "light"); }
      function apply() {
        var t = current();
        document.documentElement.setAttribute("data-theme", t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t === "dark" ? "#0f1a33" : "#1e3a8a");
        var btn = document.getElementById("themeBtn");
        if (btn) {
          var label = t === "dark" ? "Passer en thème clair" : "Passer en thème sombre";
          btn.textContent = t === "dark" ? "☀️" : "🌙";
          btn.title = label;
          btn.setAttribute("aria-label", label);
        }
      }
      apply();
      if (mq && mq.addEventListener) mq.addEventListener("change", apply);
      document.addEventListener("DOMContentLoaded", function () {
        apply();
        var btn = document.getElementById("themeBtn");
        if (btn) btn.addEventListener("click", function () {
          try { localStorage.setItem(KEY, current() === "dark" ? "light" : "dark"); } catch (e) {}
          apply();
        });
      });
    })();
  </script>
</head>
<body>
  <div id="app">
    <div class="card">
     <div class="title">
        <img src="icon-192.png" alt="Logo NextTrain" class="app-logo"> <h1>NextTrain</h1>
        <div id="appVersion" style="margin-left:auto; font-size:12px; opacity:.9"></div>
        <button id="themeBtn" type="button" class="btn" title="Changer de thème" aria-label="Changer de thème">🌙</button>
      </div>

      <div class="station-row">
        <div class="station-name" id="stationName">📍 <span id="stationNameText">Libramont</span></div>
        <div class="controls">
          <button id="favBtn" class="btn favBtn" title="Ajouter/retirer des favoris" aria-label="Ajouter ou retirer des favoris">☆</button>
          <button id="locateBtn" class="btn btn-locate" title="Localiser ma position" aria-label="Localiser ma position"><span class="btn-icon">📍</span><span class="btn-label"> Localiser</span></button>
          <button id="refreshBtn" class="btn btn-icon-only" title="Actualiser" aria-label="Actualiser">🔄</button>
        </div>
      </div>

      <div id="favoritesBar" class="favorites-bar" aria-label="Gares favorites"></div>

      <div class="search-group">
        <input id="stationSearch" class="search" placeholder="Rechercher une gare (ex: Namur, Bruxelles...)" aria-label="Recherche gare" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="stationDropdown" aria-autocomplete="list">
        <button id="stationSearchBtn" type="button" class="search-btn" title="Rechercher une gare" aria-label="Rechercher une gare">🔍</button>
        <div id="stationDropdown" class="station-dropdown" role="listbox" aria-label="Résultats de recherche de gares"></div>
      </div>
      <div class="search-group">
        <input id="trainSearch" class="search" placeholder="Rechercher un train (ex: 2112)" aria-label="Recherche train">
        <button id="trainSearchBtn" type="button" class="search-btn" title="Rechercher un train" aria-label="Rechercher un train">🔍</button>
      </div>

      <div class="tabs" style="margin-top:12px">
        <div id="tabDeparture" class="tab">🚀 Départs</div>
        <div id="tabArrival" class="tab">🏁 Arrivées</div>
      </div>

    </div>

    <div id="trainsPanel" class="panel">
      <div id="trainsList" class="list" aria-live="polite" aria-atomic="false">
        <div class="loading" id="initialLoading"><div class="spinner"></div><div style="margin-top:10px">Chargement des horaires...</div></div>
      </div>
    </div>

    <footer>
      Données en temps réel via iRail • Optimisé pour usage privé • Un bug ne pourra justifier que tu loupes ton HLP ;-)
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    // Enregistrement du Service Worker (PWA installable + support hors-ligne)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register("service-worker.js").then((reg) => {
          reg.addEventListener("updatefound", () => {
            const newWorker = reg.installing;
            newWorker?.addEventListener("statechange", () => {
              // Ne recharger que s'il s'agit d'une VRAIE mise à jour
              // (un SW contrôlait déjà la page), pas de la toute première installation.
              if (newWorker.state === "activated" && hadController) {
                window.location.reload();
              }
            });
          });
        }).catch((err) => {
          console.warn("Échec de l'enregistrement du Service Worker:", err);
        });
      });
    }
  </script>
  <script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
