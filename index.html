<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NextTrain — Horaires SNCB</title>
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NextTrain">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" href="icon-192.png">
  
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div class="card">
     <div class="title">
        <img src="icon-192.png" alt="Logo NextTrain" class="app-logo"> <h1>NextTrain</h1>
        <div id="appVersion" style="margin-left:auto; font-size:12px; opacity:.9"></div>
      </div>

      <div class="station-row">
        <div class="station-name" id="stationName">📍 <span id="stationNameText">Libramont</span></div>
        <div class="controls">
          <button id="favBtn" class="btn favBtn" title="Ajouter/retirer des favoris" aria-label="Ajouter ou retirer des favoris">☆</button>
          <button id="locateBtn" class="btn btn-locate" title="Localiser ma position" aria-label="Localiser ma position"><span class="btn-icon">📍</span><span class="btn-label"> Localiser</span></button>
          <button id="refreshBtn" class="btn btn-icon-only" title="Actualiser" aria-label="Actualiser">🔄</button>
        </div>
      </div>

      <div id="favoritesBar" class="favorites-bar" aria-label="Gares favorites"></div>

      <input id="stationSearch" class="search" placeholder="Rechercher une gare (ex: Namur, Bruxelles...)" aria-label="Recherche gare">
      <input id="trainSearch" class="search" placeholder="Rechercher un train (ex: 2112)" aria-label="Recherche train">
      <select id="stationSelect" class="station-select" size="5" aria-label="Liste des gares"></select>

      <div class="tabs" style="margin-top:12px">
        <div id="tabDeparture" class="tab">🚀 Départs</div>
        <div id="tabArrival" class="tab">🏁 Arrivées</div>
      </div>

    </div>

    <div id="trainsPanel" class="panel">
      <div id="trainsList" class="list" aria-live="polite" aria-atomic="false">
        <div class="loading" id="initialLoading"><div class="spinner"></div><div style="margin-top:10px">Chargement des horaires...</div></div>
      </div>
    </div>

    <footer>
      Données en temps réel via iRail • Optimisé pour usage privé
    </footer>
  </div>

  <script src="app.js"></script>
  <script>
    // Enregistrement du Service Worker (PWA installable + support hors-ligne)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        const hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register("service-worker.js").then((reg) => {
          reg.addEventListener("updatefound", () => {
            const newWorker = reg.installing;
            newWorker?.addEventListener("statechange", () => {
              // Ne recharger que s'il s'agit d'une VRAIE mise à jour
              // (un SW contrôlait déjà la page), pas de la toute première installation.
              if (newWorker.state === "activated" && hadController) {
                window.location.reload();
              }
            });
          });
        }).catch((err) => {
          console.warn("Échec de l'enregistrement du Service Worker:", err);
        });
      });
    }
  </script>
</body>
</html>
